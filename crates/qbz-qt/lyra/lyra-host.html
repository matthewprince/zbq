<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
  body { font-family: "Inter", "Noto Sans", system-ui, sans-serif; -webkit-user-select: none; user-select: none; }
  #lyrics { position: absolute; inset: 0; }
  /* --zbq-scale follows the lyrics text-size setting (S/M/L/XL). The side panel
     is a few hundred pixels wide and Lyra's type is sized for a whole window, so
     the host scales it down there. Lyra itself is untouched: these rules only
     outrank its own by specificity. */
  html .lyra-line { font-size: calc(clamp(26px, 3.3vw, 52px) * var(--zbq-scale, 1)); }
  html.zbq-compact .lyra-line { font-size: calc(clamp(17px, 6.2vw, 28px) * var(--zbq-scale, 1)); margin-bottom: .7em; }
  html.zbq-compact .lyra-content { padding: 0 18px; max-width: 100%; }
</style>
</head>
<body>
<div id="lyrics"></div>
<script>/*LYRA_JS*/</script>
<script>/*ZBQ_JS*/</script>
</body>
</html>
